<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>恋御籤</title>
  <style>
    body {
      background-color: #fdf5e6;
      font-family: "Hiragino Mincho ProN", "MS PMincho", serif;
      text-align: center;
      padding-top: 50px;
      color: #333;
    }

    .omikuji-box {
      background-color: #fff8dc;
      padding: 30px;
      border: 5px double #b22222;
      border-radius: 10px;
      width: 320px;
      margin: auto;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    }

    h2 {
      color: #b22222;
      border-bottom: 2px solid #b22222;
      padding-bottom: 10px;
    }

    #omikuji-result {
      min-height: 120px;
      margin-top: 20px;
    }

    button {
      background-color: #b22222;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
      border-radius: 5px;
      margin-top: 10px;
    }

    button:hover {
      background-color: #8b0000;
    }

    .fortune {
      font-size: 2em;
      font-weight: bold;
      color: #d4af37;
      margin: 0;
    }

    .message {
      font-size: 1em;
      color: #333;
      margin-top: 10px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="omikuji-box">
    <h2>恋御籤</h2>
    <div id="omikuji-result">
      <p>あなたの運勢を占います</p>
    </div>
    <button id="draw-btn" onclick="drawOmikuji()">おみくじを引く</button>
  </div>

  <script>
    const fortunes = ["大吉", "吉", "中吉", "末吉", "凶", "大凶"];

    // 運勢ごとに5種類のメッセージを設定するマップ
    const messagesByFortune = {
      "大吉": [
        "この文章",
        "素晴らしい運に恵まれています",
        "全ては上手くいきます",
        "最高の幸運が訪れます",
        "夢が実現する時が来ました"
      ],
      "吉": [
        "誠意を持って接すれば、思いは通じます。",
        "前向きな姿勢が大切です。",
        "良い流れが来ています。",
        "希望を持って進みましょう。",
        "運気は上昇中です。"
      ],
      "中吉": [
        "焦らず、自分磨きに専念しましょう。",
        "地道な努力が実ります。",
        "今は準備の時です。",
        "ゆっくりと進むことが吉。",
        "じっくり構えて進みましょう。"
      ],
      "末吉": [
        "今は静かに待つのが吉。無理な行動は控えて。",
        "落ち着きが大切な時期です。",
        "焦らず様子を見ましょう。",
        "忍耐強さが必要です。",
        "控えめな行動を心がけて。"
      ],
      "凶": [
        "相手の気持ちを尊重することを忘れずに。",
        "今は反省の時です。",
        "自分を見つめ直してください。",
        "謙虚さを忘れずに。",
        "慎重に行動しましょう。"
      ],
      "大凶": [
        "過去の執着を捨てると、新しい運気が入ってきます。",
        "変化を恐れずに進みましょう。",
        "リセットが必要な時期です。",
        "新しい出発を心がけて。",
        "全てを手放す勇気を持ちましょう。"
      ]
    };

    const drawBtn = document.getElementById('draw-btn');

    function drawOmikuji() {
      // 二重実行防止ガード: 既に無効化されていれば何もしない
      if (drawBtn && drawBtn.disabled) return;
      const fortune = fortunes[Math.floor(Math.random() * fortunes.length)];
      // 運勢に対応するメッセージ配列からランダムに選択
      const messages = messagesByFortune[fortune] || ["良い一日をお過ごしください。"];
      const message = messages[Math.floor(Math.random() * messages.length)];
      const resultDiv = document.getElementById("omikuji-result");

      resultDiv.innerHTML = `
        <p class="fortune">${fortune}</p>
        <p class="message">${message}</p>
      `;

      // 再抽選を防ぐ
      if (drawBtn) {
        drawBtn.disabled = true;
        drawBtn.style.opacity = '0.6';
      }
    }
    
  </script>
</body>
</html>
