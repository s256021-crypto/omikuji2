from IPython.display import display, HTML

html_code = """
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>恋御籤</title>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+P+One&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #fcf0f0; /* Softer, slightly pinkish background */
      font-family: 'Mochiy Pop P One', cursive; /* Apply the new cute font */
      text-align: center;
      padding-top: 50px;
      color: #333;
    }

    .omikuji-box {
      background-color: #ffffff; /* White background for the box */
      padding: 30px;
      border: 2px dashed #ffb6c1; /* Lighter, dashed pink border */
      border-radius: 25px; /* More rounded corners */
      width: 320px;
      margin: auto;
      box-shadow: 0 8px 16px rgba(255, 182, 193, 0.3); /* Softer, pink-tinted shadow */
      text-align: center; /* Add this to center the text */
    }

    h2 {
      color: #ef5350; /* Softer red for the title */
      border-bottom: 2px dotted #ef5350; /* Dotted bottom border for title */
      padding-bottom: 10px;
    }

    #omikuji-result {
      min-height: 120px;
      margin-top: 20px;
      opacity: 0; /* 初期状態では非表示 */
      animation-fill-mode: forwards; /* アニメーション終了時のスタイルを保持 */
    }

    button {
      background-color: #ff8a80; /* Softer coral for the button */
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
      border-radius: 15px; /* More rounded button */
      margin-top: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Subtle button shadow */
    }

    button:hover {
      background-color: #ff5252; /* Slightly darker coral on hover */
    }

    .fortune {
      font-size: 2em;
      font-weight: bold;
      color: #ffb6c1; /* Light pink for fortune text */
      margin: 0;
    }

    .message {
      font-size: 1em;
      color: #333;
      margin-top: 10px;
      text-align: center; /* Also center the message text */
    }

    /* フェードインアニメーション */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      animation: fadeIn 0.8s ease-out forwards;
    }
  </style>
</head>
<body>
  <div class="omikuji-box">
    <h2>恋御籤</h2>
    <div id="omikuji-result">
      <p>あなたの運勢を占います</p>
    </div>
    <button id="draw-btn" onclick="drawOmikuji()">おみくじを引く</button>
  </div>

  <script>
    const fortunes = ["大吉", "大凶"];

    const messagesByFortune = {
      "大吉": [
        "一回のいただきますより一回のご馳走様でした",
        "告白するなら食堂裏で",
        "いっぱい食べる貴方は世界一可愛いと",
        "この恋は大学芋よりも甘い",
        "この味は恋の味",
        "いただきますが世界を変えるで",
        "食は自分を強くする",
        "出来立てのチャンスは今が食べごろ",
        "食べた分相手も近づく",
        "食は火加減、恋は機嫌で",
        "隠し味はあなたの笑顔",
        "ライスのサイズは愛の大きさ",
        "よく食堂で会うならそれは運命を",
        "一日三食、一喋り",
        "その恋テクアウトできますか？",
        "ごはんは大盛り、今日の恋は熱盛！"
      ],

      "大凶": [
        "一口ちょうだいに要注意",
        "その恋まだ熟れてないかも",
        "恋の焦りは火傷の元",
        "恋と料理はスピード勝負で",
        "その恋、火加減注意と",
        "今日のご飯は塩強め",
        "今日はなんだか一味足りないと",
        "やけ食いするだけ、今は止まりなさい",
        "食の乱れは心の乱れ",
        "その恋、胃もたれしてない？",
        "その愛少し味濃いめかも",
        "ちょっと食べすぎかも、休憩も大切で",
        "そろそろ味変しよう！",
        "その恋温めなおしますか？"
      ]
    };

    const drawBtn = document.getElementById('draw-btn');

    function drawOmikuji() {
      if (drawBtn && drawBtn.disabled) return;
      const fortune = fortunes[Math.floor(Math.random() * fortunes.length)];
      const messages = messagesByFortune[fortune] || ["良い一日をお過ごしください。"];
      const message = messages[Math.floor(Math.random() * messages.length)];
      const resultDiv = document.getElementById("omikuji-result");

      // アニメーションをリセットするためにクラスを一度削除してから追加
      resultDiv.classList.remove('fade-in');
      // DOMの再描画を強制するための小技（setTimeoutなどでも可）
      void resultDiv.offsetWidth;

      resultDiv.innerHTML = `
        <p class="fortune">${fortune}</p>
        <p class="message">${message}</p>
      `;

      resultDiv.classList.add('fade-in'); // フェードインアニメーションを適用

      if (drawBtn) {
        drawBtn.disabled = true;
        drawBtn.style.opacity = '0.6';
      }
    }

  </script>
</body>
</html>
"""

display(HTML(html_code))
