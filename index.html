<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>恋御籤</title>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+P+One&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Mochiy Pop P One', cursive; /* Apply cute font */
      background: #fcf0f0; /* Softer background */
      color: #333;
      margin: 0;
      padding: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      background: #ffffff; /* White background */
      border: 2px dashed #ffb6c1; /* Lighter, dashed pink border */
      border-radius: 25px; /* More rounded corners */
      box-shadow: 0 8px 16px rgba(255, 182, 193, 0.3); /* Softer, pink-tinted shadow */
      padding: 30px;
      max-width: 500px;
      width: 100%;
    }
    h1 {
      color: #ef5350; /* Softer red for title */
      font-size: 2.5em; /* Larger title */
      margin-bottom: 15px;
    }
    p {
      font-size: 1.1em; /* Slightly larger text */
      line-height: 1.6;
      margin-bottom: 20px;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: #ff8a80; /* Softer coral for the button */
      color: white;
      text-decoration: none;
      border-radius: 15px; /* More rounded button */
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Subtle button shadow */
      transition: background-color 0.3s ease; /* Smooth transition on hover */
    }
    a:hover {
      background: #ff5252; /* Slightly darker coral on hover */
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>きゅんきゅん♡食堂恋御籤</h1>
    <p>食堂で、あなたの恋の運勢を占ってみませんか？<br>ドキドキの結果が待ってるよ！</p>
    <p><a href="omikuji1.html">おみくじを引いてみる？</a></p>
  </div>
</body>
</html>
